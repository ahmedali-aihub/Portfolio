# Render blueprint: deploys the RAG API and the static portfolio together.
#
# After the first deploy, two values still have to be set by hand because
# each depends on the other service's final URL:
#   1. portfolio-api  -> ALLOWED_ORIGINS = the portfolio-web URL
#   2. portfolio-web  -> VITE_API_URL    = the portfolio-api URL
# Set both, then redeploy the frontend so the new API URL is baked in.

services:
  - type: web
    name: portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Secret — paste the key from https://openrouter.ai/keys in the
      # Render dashboard. Never commit it.
      - key: OPENROUTER_API_KEY
        sync: false
      # Comma-separated. Must include the deployed frontend's exact origin
      # or the browser will block every chat request as a CORS failure.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: SITE_NAME
        value: Ahmed Ali Portfolio
      # Free-tier lineup rotates; verify at
      # https://openrouter.ai/models?max_price=0 if answers start failing.
      - key: OPENROUTER_MODELS
        value: google/gemma-4-26b-a4b-it:free,openai/gpt-oss-20b:free,nvidia/nemotron-nano-9b-v2:free,google/gemma-4-31b-it:free,openrouter/free

  - type: web
    name: portfolio-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
